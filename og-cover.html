<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>logee.ai — social share cover (1200×630)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#20203a;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Inter',system-ui,sans-serif}
.og{width:1200px;height:630px;background:radial-gradient(70% 90% at 82% 15%,rgba(255,208,47,.16),transparent 60%),radial-gradient(60% 80% at 8% 95%,rgba(66,98,255,.22),transparent 60%),#050038;color:#fff;position:relative;overflow:hidden;padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between}
.brand{display:flex;align-items:center;gap:16px}
.mark{width:64px;height:44px;border-radius:10px;background:#ffd02f;display:grid;place-items:center;flex-shrink:0}
.mark svg{width:90%;height:90%}
.brand b{font-size:34px;font-weight:800;letter-spacing:-1px}
.brand b small{color:#8f8ea3;font-size:20px;font-weight:700}
.pill{display:inline-block;align-self:flex-start;background:rgba(255,208,47,.14);color:#ffd02f;border:1px solid rgba(255,208,47,.4);font-weight:800;font-size:19px;padding:9px 18px;border-radius:999px;letter-spacing:.3px;margin-bottom:26px}
h1{font-size:66px;line-height:1.05;letter-spacing:-2px;font-weight:900;max-width:20ch}
h1 .hl{color:#ffd02f}
.sub{font-size:26px;color:#cfcee0;margin-top:22px;font-weight:600}
.foot{display:flex;align-items:center;gap:14px;font-size:22px;color:#b9b8cf;font-weight:600}
.foot .dot{width:8px;height:8px;border-radius:50%;background:#31d0aa;box-shadow:0 0 0 4px rgba(49,208,170,.28)}
</style>
</head>
<body>
  <div class="og" id="og">
    <div class="brand">
      <span class="mark"><svg viewBox="1.7 5.7 18.6 12.6" fill="none"><rect x="9" y="6.5" width="11.5" height="11" rx="1.8" stroke="#050038" stroke-width="2.1"/><path d="M12.8 9.3 v5.4 M16.7 9.3 v5.4" stroke="#050038" stroke-width="1.6" stroke-linecap="round"/><path d="M3.5 9 h3 M2.5 12 h4 M3.5 15 h3" stroke="#050038" stroke-width="1.8" stroke-linecap="round"/></svg></span>
      <b><span class="wm">logee<small>.ai</small></span></b>
    </div>
    <div>
      <span class="pill">AI TMS for importers &amp; exporters</span>
      <h1>The AI transport management system that <span class="hl">keeps you on track</span></h1>
      <div class="sub">Track, chase and flag every shipment. Automatically.</div>
    </div>
    <div class="foot"><span class="dot"></span>logee.ai · Start free</div>
  </div>
</body>
</html>
